name: Apply AI LP and PnL source codemod

on:
  push:
    branches:
      - fix-ai-lp-and-pnl-scoreboard-2026-07-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[codemod-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ai-lp-and-pnl-scoreboard-2026-07-30
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source codemod
        run: node scripts/codemod-ai-pnl-source.mjs
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-trader/aiDiscoveryTrader.ts worker/telegramBot.ts
          git commit -m "Wire AI PnL command and hourly scoreboard [codemod-output]"
          git push origin HEAD:fix-ai-lp-and-pnl-scoreboard-2026-07-30
