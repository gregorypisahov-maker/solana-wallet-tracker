name: Jijo copy trader checks

on:
  push:
    branches: [main]
    paths:
      - "copy-trader/**"
      - "single-bot/heliusSniperApp.ts"
      - "single-bot/sniperPaperApp.ts"
      - "supabase/migrations/20260806125000_add_jijo_copy_trader.sql"
      - ".github/workflows/jijo-copy-check.yml"
  pull_request:
    paths:
      - "copy-trader/**"
      - "single-bot/heliusSniperApp.ts"
      - "single-bot/sniperPaperApp.ts"
      - "supabase/migrations/20260806125000_add_jijo_copy_trader.sql"
      - ".github/workflows/jijo-copy-check.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Load Jijo copier module
        run: |
          NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
          SUPABASE_SERVICE_ROLE_KEY=ci-placeholder \
          node --import tsx -e "import('./copy-trader/jijoCopyTrader.ts').then((m)=>{if(typeof m.startJijoCopyTrader!=='function'||typeof m.getJijoCopyStatus!=='function')process.exit(1);console.log('Jijo copier module loaded')})"
      - run: npm run build
