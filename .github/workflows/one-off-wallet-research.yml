name: One-off wallet trade research

on:
  push:
    paths:
      - ".github/workflows/one-off-wallet-research.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Scan wallet and reconstruct trades
        env:
          WALLET: xR4kCX6N2MNqxbY78VGxUKmTBwvweHT85bvxYBn32Dx
          RPC: https://api.mainnet-beta.solana.com
        run: |
          cat > /tmp/research.mjs <<'NODE'
          import fs from 'node:fs/promises';
          const WALLET=process.env.WALLET, RPC=process.env.RPC, WSOL='So11111111111111111111111111111111111111112';
          async function rpc(method,params){
            for(let attempt=0;attempt<6;attempt++){
              const r=await fetch(RPC,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});
              if(r.status===429){await new Promise(x=>setTimeout(x,1500*(attempt+1)));continue;}
              const j=await r.json(); if(j.error) throw new Error(method+': '+JSON.stringify(j.error)); return j.result;
            }
            throw new Error(method+': rate limited');
          }
          const sigs=[]; let before;
          while(sigs.length<1000){
            const page=await rpc('getSignaturesForAddress',[WALLET,{limit:Math.min(100,1000-sigs.length),before,commitment:'finalized'}]);
            if(!page.length) break;
            sigs.push(...page.filter(x=>!x.err));
            before=page[page.length-1].signature;
            if(page.length<100) break;
            await new Promise(x=>setTimeout(x,250));
          }
          const events=[];
          for(let i=0;i<sigs.length;i+=8){
            const batch=sigs.slice(i,i+8);
            const txs=await Promise.all(batch.map(s=>rpc('getTransaction',[s.signature,{encoding:'jsonParsed',commitment:'finalized',maxSupportedTransactionVersion:1}])));
            for(let k=0;k<txs.length;k++){
              const tx=txs[k]; if(!tx?.blockTime||!tx.meta||tx.meta.err) continue;
              const keys=tx.transaction.message.accountKeys.map(x=>typeof x.pubkey==='string'?x.pubkey:x.pubkey.toString());
              const wi=keys.indexOf(WALLET); if(wi<0) continue;
              const solDelta=((tx.meta.postBalances[wi]??0)-(tx.meta.preBalances[wi]??0))/1e9;
              const pre=(tx.meta.preTokenBalances??[]).filter(b=>b.owner===WALLET&&b.mint!==WSOL);
              const post=(tx.meta.postTokenBalances??[]).filter(b=>b.owner===WALLET&&b.mint!==WSOL);
              const mints=new Set([...pre.map(x=>x.mint),...post.map(x=>x.mint)]);
              let best=null;
              for(const mint of mints){
                const a=pre.find(x=>x.mint===mint),b=post.find(x=>x.mint===mint);
                const d=Number(b?.uiTokenAmount?.uiAmount??0)-Number(a?.uiTokenAmount?.uiAmount??0);
                if(d && (!best||Math.abs(d)>Math.abs(best.delta))) best={mint,delta:d};
              }
              if(!best) continue;
              const fee=(tx.meta.fee??0)/1e9;
              if(best.delta>0&&solDelta<-fee) events.push({signature:batch[k].signature,mint:best.mint,side:'buy',sol:Math.abs(solDelta),tokens:best.delta,time:tx.blockTime});
              else if(best.delta<0&&solDelta>0) events.push({signature:batch[k].signature,mint:best.mint,side:'sell',sol:Math.abs(solDelta),tokens:Math.abs(best.delta),time:tx.blockTime});
            }
            process.stdout.write('processed '+Math.min(i+8,sigs.length)+'/'+sigs.length+'\\n');
            await new Promise(x=>setTimeout(x,200));
          }
          events.sort((a,b)=>a.time-b.time);
          const by=new Map(); for(const e of events){if(!by.has(e.mint))by.set(e.mint,[]);by.get(e.mint).push(e);}
          const trades=[];
          for(const [mint,list] of by){
            const lots=[];
            for(const e of list){
              if(e.side==='buy'){lots.push({time:e.time,sol:e.sol,tokens:e.tokens});continue;}
              let rem=e.tokens, allocSol=0,allocTok=0,first=null,entrySig=null;
              while(rem>0&&lots.length){
                const lot=lots[0],take=Math.min(rem,lot.tokens);
                allocSol+=lot.sol*(take/lot.tokens); allocTok+=take; first=first??lot.time; entrySig=entrySig??list.find(x=>x.time===lot.time)?.signature;
                lot.tokens-=take; lot.sol-=lot.sol*(take/(lot.tokens+take)); rem-=take;
                if(lot.tokens<=1e-12) lots.shift();
              }
              if(!allocTok||!first) continue;
              const exitSol=e.sol*(allocTok/e.tokens), pnl=exitSol-allocSol;
              trades.push({mint,entryTime:first,exitTime:e.time,holdSec:e.time-first,entrySol:allocSol,exitSol,pnlSol:pnl,roiPct:allocSol?pnl/allocSol*100:null,entrySig,exitSig:e.signature});
            }
          }
          trades.sort((a,b)=>b.pnlSol-a.pnlSol);
          const wins=trades.filter(x=>x.pnlSol>1e-9), losses=trades.filter(x=>x.pnlSol<-1e-9);
          const summary={wallet:WALLET,signaturesScanned:sigs.length,events:events.length,trades:trades.length,wins:wins.length,losses:losses.length,winRate:trades.length?wins.length/trades.length:null,totalPnlSol:trades.reduce((a,x)=>a+x.pnlSol,0),topWinners:wins.slice(0,20),topLosers:losses.slice().sort((a,b)=>a.pnlSol-b.pnlSol).slice(0,20)};
          await fs.writeFile('trade-research.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          NODE
          node /tmp/research.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-trade-research
          path: trade-research.json
