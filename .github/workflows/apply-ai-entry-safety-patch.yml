name: Apply AI entry safety patch

on:
  push:
    branches:
      - ai-entry-rug-screen-s2-s4

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-entry-rug-screen-s2-s4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply anchor-checked entry patch
        run: node scripts/apply-ai-entry-safety-patch.mjs
      - name: Apply anchor-checked typing fix
        run: node scripts/fix-ai-entry-safety-types.mjs
      - name: Commit patched trader
        run: |
          if git diff --quiet -- paper-trader/aiDiscoveryTrader.ts; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-trader/aiDiscoveryTrader.ts
          git commit -m "Wire token safety into AI entry path"
          git push origin HEAD:ai-entry-rug-screen-s2-s4
