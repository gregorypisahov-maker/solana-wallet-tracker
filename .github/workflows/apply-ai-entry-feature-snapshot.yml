name: Apply AI entry feature snapshot

on:
  push:
    branches:
      - feat-ai-entry-feature-snapshot-2026-07-30

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[feature-snapshot-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-ai-entry-feature-snapshot-2026-07-30
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Apply source changes
        run: node scripts/apply-ai-entry-feature-snapshot.mjs
      - name: Feature and outcome tests
        run: node --import tsx --test paper-trader/aiEntryFeatures.test.ts paper-trader/aiOutcomeTrackerV10.test.ts
      - name: TypeScript check
        run: npm run typecheck
      - name: Commit source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-trader/marketDiscoveryAgent.ts paper-trader/aiDiscoveryTrader.ts paper-trader/aiOutcomeTrackerV10.ts live-executor/liveSafety.ts
          git commit -m "Capture full AI paper entry features [feature-snapshot-output]"
          git push origin HEAD:feat-ai-entry-feature-snapshot-2026-07-30
