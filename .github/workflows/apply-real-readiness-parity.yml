name: Apply real-readiness parity patch

on:
  workflow_dispatch:
  push:
    branches: [real-readiness-parity-gate]
    paths:
      - scripts/apply-real-readiness-parity.mjs
      - paper-trader/executionParity.ts
      - supabase/migrations/20260730_ai_execution_parity.sql
      - .github/workflows/apply-real-readiness-parity.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-readiness-parity-gate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply deterministic integration patch
        run: node scripts/apply-real-readiness-parity.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit generated integration
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-trader/aiDiscoveryTrader.ts
          git commit -m "Integrate execution parity into AI discovery trader"
          git push origin HEAD:real-readiness-parity-gate
