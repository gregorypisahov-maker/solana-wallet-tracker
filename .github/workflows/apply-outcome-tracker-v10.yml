name: Apply outcome tracker v10 repair
on:
  push:
    branches: [fix/ai-outcome-tracker-v10]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-outcome-tracker-v10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch tracker and add migration
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('paper-trader/aiDiscoveryTrader.ts')
          s = p.read_text()

          s = s.replace('const VERSION = "ai_discovery_trader_v1_9_shared_entry_safety_2026_07_28";', 'const VERSION = "ai_discovery_trader_v1_10_outcome_tracker_2026_07_29";')
          s = s.replace('''const OUTCOME_BATCH_SIZE = Math.max(
  1,
  Math.min(10, Number(process.env.AI_OUTCOME_BATCH_SIZE) || 3)
);
const OUTCOME_HORIZONS = [5, 15, 30, 45] as const;''', '''const OUTCOME_BATCH_SIZE = Math.max(
  1,
  Math.min(100, Number(process.env.AI_OUTCOME_BATCH_SIZE) || 25)
);
const OUTCOME_SAMPLE_RATE = Math.min(
  1,
  Math.max(0, Number(process.env.AI_OUTCOME_SAMPLE_RATE) || 0.1)
);
const OUTCOME_HORIZONS = [5, 15, 30, 45] as const;
const OUTCOME_TOLERANCE_MS: Record<(typeof OUTCOME_HORIZONS)[number], number> = {
  5: 90_000,
  15: 120_000,
  30: 180_000,
  45: 180_000,
};''')

          old_record = re.search(r'async function recordObservation\([\s\S]*?\n}\n\nasync function markObservationEntered', s)
          if not old_record:
            raise SystemExit('recordObservation anchor not found')
          new_record = '''async function recordObservation(
  opportunity: any,
  assessment: { passed: boolean; reasons: string[] }
): Promise<number | null> {
  const cutoff = new Date(Date.now() - 2 * 60_000).toISOString();
  const { data: existing } = await supabase
    .from("ai_candidate_observations")
    .select("id")
    .eq("mint", opportunity.mint)
    .gte("observed_at", cutoff)
    .limit(1);
  if (existing?.length) return Number(existing[0].id);

  const sampled = Math.random() < OUTCOME_SAMPLE_RATE;
  const observedAt = new Date().toISOString();
  let observedPriceUsd: number | null = null;
  let observedPriceAt: string | null = null;
  if (sampled && opportunity.pair_address) {
    const market = await pairFor(opportunity.mint, opportunity.pair_address, 0).catch(() => null);
    if (market) {
      observedPriceUsd = market.priceUsd;
      observedPriceAt = new Date().toISOString();
    }
  }

  const features = {
    score: n(opportunity.score),
    confidence: opportunity.confidence,
    status: opportunity.status,
    marketRegime: opportunity.market_regime,
    liquidityUsd: n(opportunity.liquidity_usd),
    marketCapUsd: n(opportunity.market_cap_usd),
    priceChangeM5: n(opportunity.price_change_m5),
    priceChangeH1: n(opportunity.price_change_h1),
    volumeM5Usd: n(opportunity.volume_m5_usd),
    volumeH1Usd: n(opportunity.volume_h1_usd),
    buysM5: n(opportunity.buys_m5),
    sellsM5: n(opportunity.sells_m5),
    buyersM5: n(opportunity.buyers_m5),
    poolAgeMinutes: n(opportunity.pool_age_minutes),
    reasons: opportunity.reasons ?? [],
    risks: opportunity.risks ?? [],
  };

  const { data, error } = await supabase
    .from("ai_candidate_observations")
    .insert({
      mint: opportunity.mint,
      token_symbol: opportunity.token_symbol,
      pair_address: opportunity.pair_address,
      source_last_seen_at: opportunity.last_seen_at,
      observed_at: observedAt,
      observed_price_usd: observedPriceUsd,
      observed_price_at: observedPriceAt,
      outcome_tracked: sampled && observedPriceUsd != null,
      outcome_sample_source: sampled ? "random" : null,
      outcome_quality: sampled && observedPriceUsd == null ? "missing_baseline" : null,
      outcome_complete: sampled && observedPriceUsd == null,
      features,
      rules_passed: assessment.passed,
      decision: assessment.passed ? "observe" : "reject",
      rejection_reasons: assessment.reasons,
      baseline_probability: baselineProbability(opportunity),
      model_version: SHADOW_MODEL_VERSION,
    })
    .select("id")
    .single();
  if (error) throw new Error(error.message);
  return Number(data.id);
}

async function markObservationEntered'''
          s = s[:old_record.start()] + new_record + s[old_record.end():]

          old_mark = re.search(r'async function markObservationEntered\([\s\S]*?\n}\n\nasync function collectCandidateObservations', s)
          if not old_mark:
            raise SystemExit('markObservationEntered anchor not found')
          new_mark = '''async function markObservationEntered(
  id: number | null,
  entryPriceUsd: number
): Promise<void> {
  if (!id) return;
  const now = new Date().toISOString();
  await supabase
    .from("ai_candidate_observations")
    .update({
      entered: true,
      decision: "enter",
      entry_price_usd: entryPriceUsd,
      outcome_tracked: true,
      outcome_sample_source: "entered_trade",
      observed_price_usd: entryPriceUsd,
      observed_price_at: now,
      outcome_complete: false,
      outcome_quality: null,
      updated_at: now,
    })
    .eq("id", id);
}

async function collectCandidateObservations'''
          s = s[:old_mark.start()] + new_mark + s[old_mark.end():]

          old_tracker = re.search(r'async function trackCandidateOutcomes\(\): Promise<void> \{[\s\S]*?\n}\n\nasync function liveMirrorFor', s)
          if not old_tracker:
            raise SystemExit('trackCandidateOutcomes anchor not found')
          new_tracker = '''async function trackCandidateOutcomes(): Promise<void> {
  if (outcomeRunning) return;
  outcomeRunning = true;
  let measured = 0;
  let missed = 0;
  let pairsFetched = 0;
  let rateLimited = 0;
  try {
    const recent = new Date(Date.now() - 60 * 60_000).toISOString();
    const { data, error } = await supabase
      .from("ai_candidate_observations")
      .select("*")
      .eq("outcome_tracked", true)
      .eq("outcome_complete", false)
      .gte("observed_at", recent)
      .order("observed_at", { ascending: true })
      .limit(250);
    if (error) throw new Error(error.message);

    const nowMs = Date.now();
    const actionable = (data ?? [])
      .map((observation: any) => {
        const observedMs = Date.parse(observation.observed_at);
        const pending = OUTCOME_HORIZONS.find(
          (minutes) =>
            observation[`price_${minutes}m_usd`] == null &&
            !(observation.horizon_misses ?? []).includes(`${minutes}m`)
        );
        if (!pending || !Number.isFinite(observedMs)) return null;
        const targetMs = observedMs + pending * 60_000;
        const toleranceMs = OUTCOME_TOLERANCE_MS[pending];
        if (nowMs < targetMs - toleranceMs) return null;
        return { observation, pending, targetMs, toleranceMs };
      })
      .filter(Boolean)
      .sort((a: any, b: any) => a.targetMs - b.targetMs)
      .slice(0, OUTCOME_BATCH_SIZE) as Array<any>;

    const pairResults = new Map<string, Market | null>();
    for (const item of actionable) {
      const { observation, pending, targetMs, toleranceMs } = item;
      const now = new Date().toISOString();
      const misses = Array.isArray(observation.horizon_misses)
        ? [...observation.horizon_misses]
        : [];
      const updates: Record<string, unknown> = {
        updated_at: now,
        last_outcome_attempt_at: now,
        outcome_fetch_attempts: n(observation.outcome_fetch_attempts) + 1,
      };

      if (Date.now() > targetMs + toleranceMs) {
        const label = `${pending}m`;
        if (!misses.includes(label)) misses.push(label);
        updates.horizon_misses = misses;
        missed += 1;
      } else {
        const key = `${observation.mint}:${observation.pair_address}`;
        let market = pairResults.get(key);
        if (market === undefined) {
          try {
            market = await pairFor(observation.mint, observation.pair_address, 0);
            pairsFetched += 1;
          } catch (fetchError) {
            const message = fetchError instanceof Error ? fetchError.message : String(fetchError);
            if (/429/.test(message)) rateLimited += 1;
            updates.last_outcome_error = message.slice(0, 500);
            market = null;
          }
          pairResults.set(key, market);
        }
        if (market) {
          const base = n(observation.observed_price_usd, 0);
          updates[`price_${pending}m_usd`] = market.priceUsd;
          updates[`price_${pending}m_at`] = now;
          updates[`return_${pending}m_pct`] =
            base > 0
              ? Number((((market.priceUsd / base) - 1) * 100).toFixed(4))
              : null;
          updates.last_outcome_error = null;
          measured += 1;
        }
      }

      const resolved = OUTCOME_HORIZONS.map((minutes) => {
        if (minutes === pending) {
          return updates[`price_${minutes}m_usd`] != null ||
            (updates.horizon_misses as string[] | undefined)?.includes(`${minutes}m`);
        }
        return observation[`price_${minutes}m_usd`] != null || misses.includes(`${minutes}m`);
      });
      if (resolved.every(Boolean) || Date.now() > Date.parse(observation.observed_at) + 48 * 60_000) {
        const measuredCount = OUTCOME_HORIZONS.filter((minutes) =>
          minutes === pending
            ? updates[`price_${minutes}m_usd`] != null
            : observation[`price_${minutes}m_usd`] != null
        ).length;
        updates.outcome_complete = true;
        updates.outcome_quality = measuredCount === 4 ? "on_time" : measuredCount > 0 ? "partial" : "missed";
      }

      const { error: updateError } = await supabase
        .from("ai_candidate_observations")
        .update(updates)
        .eq("id", observation.id);
      if (updateError) throw new Error(updateError.message);
    }

    const { count: backlog } = await supabase
      .from("ai_candidate_observations")
      .select("id", { count: "exact", head: true })
      .eq("outcome_tracked", true)
      .eq("outcome_complete", false)
      .lt("observed_at", new Date(Date.now() - 60 * 60_000).toISOString());
    console.log(
      `[outcome-tracker] due=${actionable.length} measured=${measured} missed=${missed} ` +
        `pairsFetched=${pairsFetched} 429=${rateLimited} backlog=${backlog ?? 0}`
    );
  } finally {
    outcomeRunning = false;
  }
}

async function liveMirrorFor'''
          s = s[:old_tracker.start()] + new_tracker + s[old_tracker.end():]

          s = s.replace('`outcomeBatch=${OUTCOME_BATCH_SIZE}; ` +', '`outcomeBatch=${OUTCOME_BATCH_SIZE} sampleRate=${OUTCOME_SAMPLE_RATE}; ` +')
          p.write_text(s)

          migration = Path('supabase/migrations/20260729090000_repair_ai_candidate_outcomes.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''alter table public.ai_candidate_observations
  add column if not exists observed_price_usd numeric,
  add column if not exists observed_price_at timestamptz,
  add column if not exists price_5m_at timestamptz,
  add column if not exists price_15m_at timestamptz,
  add column if not exists price_30m_at timestamptz,
  add column if not exists price_45m_at timestamptz,
  add column if not exists outcome_tracked boolean not null default false,
  add column if not exists outcome_sample_source text,
  add column if not exists outcome_quality text,
  add column if not exists horizon_misses text[] not null default '{}',
  add column if not exists outcome_fetch_attempts integer not null default 0,
  add column if not exists last_outcome_attempt_at timestamptz,
  add column if not exists last_outcome_error text;

update public.ai_candidate_observations
set outcome_quality = 'unusable_legacy',
    outcome_tracked = false
where outcome_complete = true
  and outcome_quality is null;

create index if not exists ai_candidate_obs_tracking_idx
  on public.ai_candidate_observations (outcome_tracked, outcome_complete, observed_at)
  where outcome_tracked = true and outcome_complete = false;
''')

          Path('.github/workflows/apply-outcome-tracker-v10.yml').unlink()
      - name: Typecheck
        run: npm ci && npm run typecheck --if-present
      - name: Commit generated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add paper-trader/aiDiscoveryTrader.ts supabase/migrations/20260729090000_repair_ai_candidate_outcomes.sql .github/workflows/apply-outcome-tracker-v10.yml
          git commit -m "fix: repair AI outcome tracking integrity"
          git push origin HEAD:fix/ai-outcome-tracker-v10
