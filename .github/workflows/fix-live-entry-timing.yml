name: Validate live entry timing fix

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/live-entry-timing
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply guarded patch
        run: python3 scripts/apply-live-entry-timing-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused live-entry timing tests
        run: node --import tsx --test lib/liveEntryTiming.test.ts

      - name: Run existing full test suite (informational)
        id: full_tests
        continue-on-error: true
        run: npm test

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Report existing suite status
        run: echo "Existing full-suite outcome=${{ steps.full_tests.outcome }}; focused timing tests, typecheck, and build are required gates."

      - name: Reject unexpected source changes
        shell: bash
        run: |
          python3 <<'PY'
          import subprocess

          allowed = {
              ".github/workflows/fix-live-entry-timing.yml",
              "scripts/apply-live-entry-timing-fix.py",
              "live-executor/liveExecutor.ts",
              "live-executor/liveEntryTiming.ts",
              "lib/liveEntryTiming.test.ts",
              "supabase/migrations/20260728235900_fix_live_entry_signal_timestamp.sql",
          }
          output = subprocess.check_output(
              ["git", "status", "--porcelain"], text=True
          ).splitlines()
          changed = {line[3:] for line in output if len(line) > 3}
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"Unexpected files changed during validation: {unexpected}")
          print("Validated changed files:", sorted(changed))
          PY

      - name: Commit validated fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-live-entry-timing.yml \
                 scripts/apply-live-entry-timing-fix.py
          git add live-executor/liveExecutor.ts \
                  live-executor/liveEntryTiming.ts \
                  lib/liveEntryTiming.test.ts \
                  supabase/migrations/20260728235900_fix_live_entry_signal_timestamp.sql
          git commit -m "fix: preserve live entry timing across signal creators"
          git push origin HEAD:fix/live-entry-timing
