name: Apply paper safety validation fix
on:
  push:
    branches: [paper-safety-validation-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-safety-validation-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/apply-paper-safety-validation-fix.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper-trader/aiDiscoveryTrader.ts live-executor/liveSafety.ts
          git commit -m "Wire shared safety into paper validation" || exit 0
          git push origin HEAD:paper-safety-validation-fix
