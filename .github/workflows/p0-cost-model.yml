name: P0 cost model

on:
  pull_request:
    paths:
      - "paper-trader/**"
      - "scripts/patch-p0-*.mjs"
      - "supabase/migrations/2026072315*.sql"
      - "package.json"
      - ".github/workflows/p0-cost-model.yml"
  push:
    branches: [main]
    paths:
      - "paper-trader/**"
      - "scripts/patch-p0-*.mjs"
      - "supabase/migrations/2026072315*.sql"
      - "package.json"
      - ".github/workflows/p0-cost-model.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --silent
      - name: P0 unit and runtime-patch tests
        id: p0_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test paper-trader/executionCosts.test.ts paper-trader/p0RuntimePatches.test.ts > p0-test.log 2>&1
      - name: Upload P0 test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-test-output
          path: p0-test.log
          if-no-files-found: error
      - name: Fail on P0 test error
        if: steps.p0_tests.outcome == 'failure'
        run: exit 1
      - name: TypeScript check
        run: npm run typecheck
